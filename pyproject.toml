[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "word-madness-bot"
version = "0.1.0"
description = "A modular Android automation bot for Word Madness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "Pillow>=11,<12",
]

[project.scripts]
word-madness-bot = "word_madness_bot.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
database = ["database/levels.json"]
templates = ["templates/manifest.json", "templates/README.md"]
"templates/ads" = ["templates/ads/manifest.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["config", "core", "main.py", "tools"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
