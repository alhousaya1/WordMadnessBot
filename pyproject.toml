[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "word-madness-bot"
version = "0.1.0"
description = "Production foundation for the Word Madness Android automation bot"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Word Madness Bot contributors" }]
dependencies = ["Pillow>=11.0"]

[project.scripts]
word-madness-bot = "word_madness_bot.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"word_madness_bot.resources.levels" = ["levels.json"]
"word_madness_bot.resources.templates" = ["*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B018"]

[tool.mypy]
python_version = "3.11"
files = ["src/word_madness_bot", "tests"]
strict = true
follow_imports = "skip"
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = "^venv/"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = ["hardware: opt-in tests requiring a connected Android device"]
testpaths = ["tests"]
pythonpath = ["src"]
